<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#09090b" />
<title>Offline · EuroCollection</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #09090b; color: #f4f4f5;
    min-height: 100svh; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; }
  .card { max-width: 380px; }
  .coin { font-size: 64px; }
  h1 { font-size: 24px; margin: 12px 0 8px; }
  p { font-size: 14px; color: #a1a1aa; line-height: 1.5; }
  button { margin-top: 20px; padding: 12px 28px; border: 0; border-radius: 999px;
    background: #f4f4f5; color: #18181b; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
  <div class="card">
    <div class="coin">🪙</div>
    <h1>Sei offline</h1>
    <p>EuroCollection ha bisogno della connessione per caricare catalogo e collezione. Riconnettiti e riprova.</p>
    <button onclick="location.reload()">Riprova</button>
  </div>
</body>
</html>
